server {
  listen 3001;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback. index.html must NEVER be cached — when a deploy produces
  # a new bundle filename, the browser must always fetch a fresh shell.
  location = / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
    try_files /index.html =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
  }

  # Vite hashes asset filenames (e.g. index-BG0oF6mS.js), so they can be
  # cached aggressively — a new deploy produces a new filename.
  location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
